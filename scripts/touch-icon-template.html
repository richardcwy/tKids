<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>tKids touch icon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 180px; height: 180px;
    overflow: hidden;
    background: radial-gradient(circle at 30% 30%, #2e5fff 0%, #0a1340 60%, #03061a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .star {
    width: 130px;
    height: 130px;
    color: #ffd84a;
    filter:
      drop-shadow(0 0 12px rgba(255, 216, 74, 0.6))
      drop-shadow(0 0 28px rgba(255, 216, 74, 0.35));
  }
  .star svg { width: 100%; height: 100%; fill: currentColor; display: block; }
</style>
</head>
<body>
  <div class="star">
    <svg viewBox="0 0 24 24">
      <polygon
        points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"
      />
    </svg>
  </div>
</body>
</html>
