<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>tKids OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=DM+Serif+Display&family=JetBrains+Mono:wght@400&family=Noto+Sans+TC:wght@400&display=block" rel="stylesheet">
<style>
  :root {
    --midnight: #03061a;
    --navy: #0a1340;
    --electric: #2e5fff;
    --glow: #5b85ff;
    --ice: #b8ccff;
    --white: #ffffff;
    --gold: #ffd84a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--midnight);
    font-family: "JetBrains Mono", monospace;
    color: var(--ice);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* atmospheric background (same language as the hero) */
  .bg {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 1200px 800px at 75% 30%, rgba(46,95,255,0.48) 0%, transparent 55%),
      radial-gradient(ellipse 900px 600px at 15% 75%, rgba(91,133,255,0.30) 0%, transparent 50%),
      radial-gradient(ellipse 700px 500px at 50% 0%, rgba(17,34,128,0.50) 0%, transparent 60%),
      radial-gradient(ellipse 500px 400px at 90% 90%, rgba(255,179,71,0.12) 0%, transparent 60%),
      linear-gradient(180deg, var(--midnight) 0%, #050930 100%);
  }
  .spot {
    position: absolute; border-radius: 50%;
    filter: blur(90px); mix-blend-mode: screen;
    z-index: 0;
  }
  .spot-1 {
    width: 760px; height: 760px;
    top: -120px; left: 120px;
    background: radial-gradient(circle, rgba(46,95,255,0.6) 0%, transparent 65%);
  }
  .spot-2 {
    width: 680px; height: 680px;
    top: 60px; right: 100px;
    background: radial-gradient(circle, rgba(91,133,255,0.55) 0%, transparent 65%);
  }
  .stars { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .star {
    position: absolute;
    filter: drop-shadow(0 0 14px currentColor) drop-shadow(0 0 28px currentColor);
  }
  .star svg { width: 100%; height: 100%; fill: currentColor; display: block; }

  /* main card */
  .card {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 60px;
  }
  .wordmark {
    font-family: "Unbounded", sans-serif;
    font-weight: 800;
    font-size: 240px;
    line-height: 0.85;
    letter-spacing: -0.05em;
    color: var(--white);
    text-shadow:
      0 0 80px rgba(46,95,255,0.5),
      0 0 160px rgba(46,95,255,0.25);
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
  }
  .wm-star {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 0.6em;
    height: 0.6em;
    margin: 0 0.02em;
    color: var(--gold);
    filter: drop-shadow(0 0 0.18em rgba(255,216,74,0.6));
    transform: translateY(-0.02em);
  }
  .wm-star svg { width: 100%; height: 100%; fill: currentColor; display: block; }

  .slogan {
    font-family: "DM Serif Display", serif;
    font-size: 48px;
    color: var(--white);
    margin-top: 36px;
    text-shadow: 0 2px 30px rgba(46,95,255,0.28);
  }
  .slogan-zh {
    font-family: "Noto Sans TC", sans-serif;
    font-weight: 400;
    font-size: 22px;
    color: var(--ice);
    letter-spacing: 0.18em;
    margin-top: 14px;
    opacity: 0.9;
  }
  .domain {
    font-family: "JetBrains Mono", monospace;
    font-size: 18px;
    color: var(--glow);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 40px;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="spot spot-1"></div>
<div class="spot spot-2"></div>
<div class="stars">
  <div class="star" style="top:8%;left:6%;width:48px;height:48px;color:var(--gold)"><svg viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></div>
  <div class="star" style="top:18%;right:9%;width:32px;height:32px;color:#ffb347"><svg viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></div>
  <div class="star" style="bottom:14%;left:10%;width:38px;height:38px;color:var(--gold)"><svg viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></div>
  <div class="star" style="bottom:10%;right:12%;width:42px;height:42px;color:#ffb347"><svg viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></div>
</div>

<div class="card">
  <div class="wordmark">
    <span>t</span>
    <span class="wm-star"><svg viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg></span>
    <span>Kids</span>
  </div>
  <div class="slogan">Ignite and shine!</div>
  <div class="slogan-zh" lang="zh-TW">點亮宇宙的三個男孩</div>
  <div class="domain">tkids.tw · EP out 2026</div>
</div>
</body>
</html>
