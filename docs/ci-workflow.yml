name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Stub envs so the build / Better-Auth instantiation passes Zod
      # validation. Real values are bound at deploy time via Alchemy.
      DATABASE_URL: file:./local.db
      DATABASE_AUTH_TOKEN: ""
      BETTER_AUTH_SECRET: ci-secret-stub-must-be-at-least-32-chars-long
      BETTER_AUTH_URL: http://localhost:4321
      POLAR_ACCESS_TOKEN: ci-stub
      POLAR_SUCCESS_URL: http://localhost:4321/dashboard
      RESEND_API_KEY: ""
      TURNSTILE_SECRET_KEY: ""
      PUBLIC_SERVER_URL: http://localhost:4321
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache bun deps
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Seed Alchemy local wrangler config (build needs it)
        working-directory: apps/web
        run: |
          mkdir -p .alchemy/local
          cat > .alchemy/local/wrangler.jsonc <<'EOF'
          {
            "name": "tkids-web-ci",
            "compatibility_date": "2026-04-01",
            "compatibility_flags": ["nodejs_compat"]
          }
          EOF

      - name: Astro build
        run: bun run build

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip the deploy job entirely when the secret is absent (so a fresh
    # repo doesn't fail CI before Cloudflare is wired). Set
    # CLOUDFLARE_API_TOKEN in repo Settings → Secrets to enable.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
      POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
      POLAR_SUCCESS_URL: ${{ secrets.POLAR_SUCCESS_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      PUBLIC_SERVER_URL: ${{ secrets.PUBLIC_SERVER_URL }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
      NODE_ENV: production
    steps:
      - name: Skip if no Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN secret not set — skipping deploy."
          echo "Add it under repo Settings → Secrets → Actions to enable auto-deploy on merge to main."
          exit 0

      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4

      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - if: env.CLOUDFLARE_API_TOKEN != ''
        name: Cache bun deps
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - if: env.CLOUDFLARE_API_TOKEN != ''
        name: Install
        run: bun install --frozen-lockfile

      - if: env.CLOUDFLARE_API_TOKEN != ''
        name: Build
        run: bun run build

      - if: env.CLOUDFLARE_API_TOKEN != ''
        name: Alchemy deploy
        run: bun run deploy
