name: Nightly Turso backup

on:
  schedule:
    # 19:00 UTC = 03:00 Taipei (UTC+8) — post-midnight window there,
    # off-peak elsewhere. Adjust if you get complaints.
    - cron: "0 19 * * *"
  workflow_dispatch: # manual trigger from Actions tab

permissions:
  contents: read

jobs:
  backup:
    name: Dump Turso -> R2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: tkids-backups
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install
        run: bun install --frozen-lockfile

      - name: Dump + upload
        run: bun run backup

      - name: Keep a GitHub Actions artifact as a second copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turso-backup-${{ github.run_id }}
          path: turso-*.sql.gz
          retention-days: 30
